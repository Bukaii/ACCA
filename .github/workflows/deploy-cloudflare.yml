name: Deploy ACCA Cloudflare Worker

on:
  push:
    branches: [main]
    paths:
      - 'cloudflare/**'
      - '.github/workflows/deploy-cloudflare.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: acca-cloudflare-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check Cloudflare credentials
        run: |
          set -euo pipefail
          if [[ -z "$CLOUDFLARE_API_TOKEN" || -z "$CLOUDFLARE_ACCOUNT_ID" ]]; then
            echo "::error::Configure CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID as GitHub Actions secrets."
            exit 1
          fi
          # GitHub secrets sometimes include trailing newlines from copy/paste.
          CLOUDFLARE_ACCOUNT_ID="$(printf %s "$CLOUDFLARE_ACCOUNT_ID" | tr -d '[:space:]')"
          echo "CLOUDFLARE_ACCOUNT_ID length: ${#CLOUDFLARE_ACCOUNT_ID} (expected: 32)"
          if [[ ! "$CLOUDFLARE_ACCOUNT_ID" =~ ^[a-fA-F0-9]{32}$ ]]; then
            echo "::error::CLOUDFLARE_ACCOUNT_ID must be the 32-character hexadecimal Account ID, not a token, URL, or API key."
            exit 1
          fi

      - name: Create queue if missing
        run: |
          CLOUDFLARE_ACCOUNT_ID="$(printf %s "$CLOUDFLARE_ACCOUNT_ID" | tr -d '[:space:]')"
          set -euo pipefail
          API="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/queues"
          STATUS=$(curl -sS -o /tmp/acca-queue-list.json -w '%{http_code}' \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "$API?per_page=100")
          if [[ "$STATUS" != "200" ]]; then
            echo "::error::Cloudflare Queue list failed (HTTP $STATUS)"
            cat /tmp/acca-queue-list.json
            exit 1
          fi
          if jq -e '.result[]? | select(.queue_name == "acca-partidas")' /tmp/acca-queue-list.json >/dev/null; then
            echo "Queue acca-partidas already exists"
          else
            STATUS=$(curl -sS -o /tmp/acca-queue-create.json -w '%{http_code}' \
              -X POST "$API" \
              -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              -H "Content-Type: application/json" \
              --data '{"queue_name":"acca-partidas"}')
            if [[ "$STATUS" != "200" && "$STATUS" != "201" ]]; then
              echo "::error::Cloudflare Queue creation failed (HTTP $STATUS)"
              cat /tmp/acca-queue-create.json
              exit 1
            fi
            jq -e '.success == true' /tmp/acca-queue-create.json >/dev/null
            echo "Queue acca-partidas created"
          fi

      - name: Validate Worker JavaScript
        run: |
          node --check cloudflare/src/index.js
          node --check cloudflare/src/sheets.js

      - name: Deploy Worker and Queue bindings
        working-directory: cloudflare
        run: |
          export CLOUDFLARE_ACCOUNT_ID="$(printf %s "$CLOUDFLARE_ACCOUNT_ID" | tr -d '[:space:]')"
          npx --yes wrangler@4 deploy

      - name: Configure Google Sheets service account for immediate publishing
        working-directory: cloudflare
        env:
          GOOGLE_CREDENTIALS_JSON: ${{ secrets.GOOGLE_CREDENTIALS_JSON }}
        run: |
          set -euo pipefail
          if [[ -z "$GOOGLE_CREDENTIALS_JSON" ]]; then
            echo "::error::GOOGLE_CREDENTIALS_JSON is required for immediate Google Sheets publication"
            exit 1
          fi
          export CLOUDFLARE_ACCOUNT_ID="$(printf %s "$CLOUDFLARE_ACCOUNT_ID" | tr -d '[:space:]')"
          printf %s "$GOOGLE_CREDENTIALS_JSON" | npx --yes wrangler@4 secret put GOOGLE_CREDENTIALS_JSON

      - name: Register Discord commands and verify API response
        working-directory: cloudflare
        run: |
          set -euo pipefail
          export CLOUDFLARE_ACCOUNT_ID="$(printf %s "$CLOUDFLARE_ACCOUNT_ID" | tr -d '[:space:]')"
          REGISTRATION_KEY="$(openssl rand -hex 32)"
          echo "::add-mask::$REGISTRATION_KEY"
          printf %s "$REGISTRATION_KEY" | npx --yes wrangler@4 secret put ACCA_REGISTRATION_KEY
          STATUS=000
          for attempt in {1..12}; do
            STATUS=$(curl -sS -o /tmp/acca-discord-register.json -w '%{http_code}' \
              -X POST 'https://acca-discord-bot.lyanosongbo8.workers.dev/__register-commands' \
              -H "X-ACCA-Registration-Key: $REGISTRATION_KEY")
            if [[ "$STATUS" == "200" ]]; then break; fi
            echo "Registration attempt $attempt: HTTP $STATUS; waiting for Worker secret propagation"
            sleep 5
          done
          cat /tmp/acca-discord-register.json
          if [[ "$STATUS" != "200" ]] || ! jq -e '.ok == true and (.registered | index("jugador")) and (.registered | index("lista"))' /tmp/acca-discord-register.json >/dev/null; then
            echo "::error::Discord slash-command registration failed (HTTP $STATUS)"
            exit 1
          fi
          echo "Discord slash commands registered and verified"
