name: Sincronizar ACCA
on:
  push:
    branches: [main]
    paths:
      - 'acca_stats/**'
      - '.github/workflows/sync.yml'
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
    inputs:
      operation:
        description: 'Operación manual'
        required: true
        default: 'sync'
        type: choice
        options:
          - sync
          - add-match
          - refresh-match
          - rebuild
          - players
          - init
          - check
      match_ids:
        description: 'IDs de partidas separados por espacios (para add-match o refresh-match)'
        required: false
        type: string
permissions:
  contents: read
concurrency:
  group: acca-sheets-sync
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - name: Ejecutar operación solicitada
        env:
          SUPABASE_URL: https://nbariaodntfhgnldusmq.supabase.co
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
          GOOGLE_SHEET_ID_PLAYERS: ${{ secrets.GOOGLE_SHEET_ID_PLAYERS }}
          GOOGLE_CREDENTIALS_JSON: ${{ secrets.GOOGLE_CREDENTIALS_JSON }}
          OPERATION: ${{ inputs.operation }}
          MATCH_IDS: ${{ inputs.match_ids }}
        run: |
          set -euo pipefail
          # Reporting reads only archived Supabase data; Cloudflare ingests Discord matches.
          OPERATION="${OPERATION:-sync}"
          case "$OPERATION" in
            sync|rebuild|players|init|check)
              if [ -n "$MATCH_IDS" ]; then
                echo "::error::La operación $OPERATION no admite IDs. Usá add-match o refresh-match."
                exit 1
              fi
              python -m acca_stats "$OPERATION"
              ;;
            add-match|refresh-match)
              echo "::error::Las partidas se agregan con /partida en Discord. Esta tarea solo publica desde Supabase."
              exit 1
              ;;
            *)
              echo "::error::Operación no válida: $OPERATION"
              exit 1
              ;;
          esac
