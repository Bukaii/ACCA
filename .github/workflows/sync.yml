name: Sincronizar ACCA
on:
  push:
    branches: [main]
    paths:
      - 'acca_stats/**'
      - '.github/workflows/sync.yml'
  schedule:
    - cron: '7 * * * *'
  workflow_dispatch:
    inputs:
      match_ids:
        description: 'IDs separados por espacios (opcional)'
        required: false
        type: string
permissions:
  contents: read
concurrency:
  group: acca-sheets-sync
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - name: Sync
        env:
          RIOT_API_KEY: ${{ secrets.RIOT_API_KEY }}
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
          GOOGLE_SHEET_ID_PLAYERS: ${{ secrets.GOOGLE_SHEET_ID_PLAYERS }}
          GOOGLE_CREDENTIALS_JSON: ${{ secrets.GOOGLE_CREDENTIALS_JSON }}
          MATCH_IDS: ${{ inputs.match_ids }}
        run: |
          if [ -n "$MATCH_IDS" ]; then
            read -ra IDS <<< "$MATCH_IDS"
            python -m acca_stats add-match "${IDS[@]}"
          else
            python -m acca_stats sync
          fi
